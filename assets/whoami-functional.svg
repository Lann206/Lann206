  <text x="48" y="299" fill="#ffb199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">analysis/</text>
  <text x="214" y="299" fill="#c7d4cd" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">requerimientos · procesos · reglas</text>
  <text x="48" y="326" fill="#ffb199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">validation/</text>
  <text x="214" y="326" fill="#c7d4cd" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">QA funcional · evidencia · soporte</text>

