<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Lanfranco Pucheta — Analista Funcional Jr.</title>
  <desc id="desc">Tarjeta visual de perfil con foco en análisis funcional, procesos, datos y validación.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d9f477"/>
      <stop offset="1" stop-color="#ff7148"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="390" rx="18" fill="#102b28"/>
  <rect x="9" y="9" width="942" height="372" rx="13" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="35" cy="35" r="5" fill="#ff7148"/>
  <circle cx="54" cy="35" r="5" fill="#f4d36f"/>
  <circle cx="73" cy="35" r="5" fill="#d9f477"/>
  <text x="98" y="41" fill="#91a79b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">lanfranco · functional profile · active</text>
  <path d="M29 58H931" stroke="#2f514a"/>

  <rect x="29" y="78" width="594" height="271" rx="9" fill="#183a35" stroke="#46665f" stroke-width="1.5"/>
  <text x="48" y="111" fill="#d9f477" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700">❯ whoami</text>
