  <circle cx="698" cy="203" r="5" fill="#fffdf8" filter="url(#glow)">
    <animate attributeName="cx" values="698;761;824;887;698" keyTimes="0;.3;.6;.9;1" dur="5.8s" repeatCount="indefinite"/>
