  <text x="674" y="111" fill="#ffb199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">functional runtime</text>

  <path d="M686 203 H895" stroke="#496760" stroke-width="2" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/>
  </path>

  <g fill="#102b28" stroke="#d9f477">
    <circle cx="698" cy="203" r="12"/>
    <circle cx="761" cy="203" r="12"/>
    <circle cx="824" cy="203" r="12"/>
    <circle cx="887" cy="203" r="12"/>
