  <text x="706" y="286" fill="#d9f477" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">status: open_to_work</text>
  <text x="674" y="326" fill="#91a79b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">systems · process · QA</text>
