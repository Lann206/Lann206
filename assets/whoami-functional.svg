  <text x="262" y="143" fill="#ffb199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">Analista Funcional Jr.</text>

  <path d="M48 166H604" stroke="#2f514a"/>
  <text x="48" y="196" fill="#91a79b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">context:</text>
  <text x="166" y="196" fill="#d9f477" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">Córdoba, Argentina</text>
  <text x="48" y="225" fill="#91a79b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">mission:</text>
  <text x="166" y="225" fill="#fffdf8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">ordenar necesidades y volverlas verificables</text>

