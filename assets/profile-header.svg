<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0D1A2B"/>
      <stop offset="1" stop-color="#0A3E59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="30" fill="url(#bg)"/>
  <g opacity=".12">
    <rect x="-260" y="0" width="220" height="320" fill="#7DD3FC">
      <animate attributeName="x" values="-260;1240" dur="8.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="1040" cy="10" r="210" fill="#38BDF8" fill-opacity="0.04">
    <animate attributeName="cx" values="1040;1085;1040" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1160" cy="300" r="230" fill="#2563EB" fill-opacity="0.04">
    <animate attributeName="cy" values="300;260;300" dur="16s" repeatCount="indefinite"/>
  </circle>

  <rect x="64" y="58" width="7" height="204" rx="3.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <text x="104" y="108" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700">Lanfranco Pucheta</text>
  <text x="104" y="151" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">Analista Funcional Jr. · Ingeniería en Sistemas</text>
  <text x="104" y="198" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Conecto necesidades, procesos y equipos técnicos para convertirlos</text>
  <text x="104" y="224" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">en soluciones claras, trazables y verificables.</text>
  <text x="104" y="262" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Requerimientos · Procesos · SQL · Scrum · Testing Funcional</text>

  <g transform="translate(104,282)">
    <circle cx="5" cy="5" r="5" fill="#d9f477">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" fill="#B6C8C0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing=".8">PROFILE / ACTIVE</text>
  </g>

  <g transform="translate(770,62)">
    <text x="0" y="0" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6">FLUJO DE TRABAJO</text>

    <g transform="translate(0,28)">
      <rect x="0" y="0" width="300" height="188" rx="22" fill="#0B1726" fill-opacity="0.86" stroke="#1F3851"/>
      <rect x="22" y="23" width="256" height="1" fill="#1E3A5F"/>

      <path d="M45 86 H115 H185 H255" stroke="#38BDF8" stroke-opacity="0.26" stroke-width="2" stroke-dasharray="7 8">
        <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.2s" repeatCount="indefinite"/>
      </path>

      <g fill="#0E2031" stroke="#38BDF8" stroke-opacity="0.8">
        <circle cx="45" cy="86" r="15"/>
        <circle cx="115" cy="86" r="15"/>
        <circle cx="185" cy="86" r="15"/>
        <circle cx="255" cy="86" r="15"/>
      </g>

      <g fill="#7DD3FC">
        <circle cx="45" cy="86" r="4"/>
        <circle cx="115" cy="86" r="4"/>
        <circle cx="185" cy="86" r="4"/>
        <circle cx="255" cy="86" r="4"/>
      </g>

      <circle cx="45" cy="86" r="5" fill="#E0F2FE" filter="url(#glow)">
        <animate attributeName="cx" values="45;115;185;255" dur="5.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" dur="5.6s" repeatCount="indefinite"/>
      </circle>

      <g fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" text-anchor="middle">
        <text x="45" y="124">Entender</text>
        <text x="115" y="124">Definir</text>
        <text x="185" y="124">Validar</text>
        <text x="255" y="124">Mejorar</text>
      </g>

      <rect x="37" y="145" width="226" height="28" rx="14" fill="#0D2134" stroke="#1D4F70"/>
      <text x="150" y="164" text-anchor="middle" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700">NEGOCIO ↔ TECNOLOGÍA</text>
    </g>
  </g>
</svg>