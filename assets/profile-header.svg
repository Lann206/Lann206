<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111F">
        <animate attributeName="stop-color" values="#08111F;#0B1730;#08111F" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.58" stop-color="#101B2C">
        <animate attributeName="stop-color" values="#101B2C;#10253A;#101B2C" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0A4361">
        <animate attributeName="stop-color" values="#0A4361;#0B5275;#0A4361" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>

  <circle cx="1080" cy="52" r="170" fill="#38BDF8" fill-opacity="0.045">
    <animate attributeName="cx" values="1080;1055;1080" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="52;68;52" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="278" r="220" fill="#2563EB" fill-opacity="0.045">
    <animate attributeName="cx" values="1120;1090;1120" dur="14s" repeatCount="indefinite"/>
  </circle>

  <rect x="72" y="60" width="8" height="180" rx="4" fill="url(#accent)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="112" y="108" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700">Lanfranco Pucheta</text>
  <text x="112" y="153" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Analista Funcional Jr. · Ingeniería en Sistemas</text>
  <text x="112" y="198" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Conecto necesidades, procesos y equipos técnicos para convertirlos en soluciones claras.</text>
  <text x="112" y="235" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Requerimientos · Procesos · SQL · Scrum · Testing Funcional</text>

  <!-- Flujo funcional animado -->
  <g transform="translate(835,72)">
    <text x="0" y="0" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">DEL PROBLEMA A LA SOLUCIÓN</text>

    <path d="M35 62 H135 H235" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="7 8">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <circle cx="35" cy="62" r="17" fill="#0F2437" stroke="#38BDF8" stroke-opacity="0.85"/>
    <circle cx="135" cy="62" r="17" fill="#0F2437" stroke="#38BDF8" stroke-opacity="0.85"/>
    <circle cx="235" cy="62" r="17" fill="#0F2437" stroke="#38BDF8" stroke-opacity="0.85"/>

    <circle cx="35" cy="62" r="4" fill="#7DD3FC"/>
    <circle cx="135" cy="62" r="4" fill="#7DD3FC"/>
    <circle cx="235" cy="62" r="4" fill="#7DD3FC"/>

    <circle cx="35" cy="62" r="7" fill="#38BDF8" fill-opacity="0.25" filter="url(#softGlow)">
      <animate attributeName="r" values="6;13;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.18;0.38;0.18" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="35" cy="62" r="4" fill="#E0F2FE">
      <animate attributeName="cx" values="35;135;235" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.6s" repeatCount="indefinite"/>
    </circle>

    <text x="35" y="102" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Necesidad</text>
    <text x="135" y="102" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Requerimiento</text>
    <text x="235" y="102" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Solución</text>

    <rect x="18" y="132" width="235" height="34" rx="17" fill="#0B1A2B" stroke="#1E3A5F"/>
    <text x="135.5" y="154" text-anchor="middle" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">ANALIZAR · DEFINIR · VALIDAR</text>
  </g>
</svg>